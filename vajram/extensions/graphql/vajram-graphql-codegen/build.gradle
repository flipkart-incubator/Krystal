description = "GraphQL codegen extension for Krystal - Generates code that connects GraphQL schemas to Vajrams"

dependencies {
    api project(':vajram:vajram-java-sdk')

    implementation project(':vajram:extensions:graphql:vajram-graphql')
    implementation project(':vajram:extensions:graphql:vajram-graphql-schema-common')
    implementation project(':krystal-codegen-common')
    implementation project(':vajram:vajram-codegen-common')
    implementation project(':vajram:extensions:json:vajram-json')

    implementation 'com.squareup:javapoet'
    implementation 'com.graphql-java:graphql-java'
    implementation libs.jackson.annotations
    implementation libs.jackson.databind

    testImplementation 'org.junit.jupiter:junit-jupiter'
}
