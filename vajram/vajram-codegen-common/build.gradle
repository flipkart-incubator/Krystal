description =
        '''Common utility code for Vajram code generation.'''

dependencies {
    api project(':vajram:vajram-java-sdk')
    api project(':krystal-codegen-common')
    implementation 'com.squareup:javapoet'

    // Needed on the test runtime classpath so in-process javac/annotation-processing tests
    // (e.g. ErrableMapKeyValidationTest) can resolve annotations that generated code refers to.
    testImplementation 'org.projectlombok:lombok'
}

publishToMavenLocal {
    dependsOn ':krystal-codegen-common:publishToMavenLocal'
    dependsOn ':vajram:vajram-java-sdk:publishToMavenLocal'
}

checkerFramework {
    extraJavacArgs += ['-AresolveReflection',]
}
