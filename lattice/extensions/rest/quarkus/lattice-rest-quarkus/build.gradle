description = "Quarkus REST extension for Lattice - Facilitates using Quarkus to power REST services in Lattice Apps"

dependencies {
    api platform(libs.quarkus.bom)

    api 'io.vertx:vertx-web'
    api project(':lattice:extensions:quarkus:lattice-quarkus')
    api project(':lattice:extensions:rest:lattice-rest')
    api project(':lattice:extensions:rest:lattice-rest-api')

    implementation 'jakarta.ws.rs:jakarta.ws.rs-api'
    implementation 'io.quarkus:quarkus-rest'
}

extraJavaModuleInfo {
    failOnMissingModuleInfo = false
}