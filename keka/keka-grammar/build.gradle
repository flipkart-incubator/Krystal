plugins {
    id 'antlr'
}

description = "The language for an experimental programming language called 'keka' which embodies the design philosophy of Krystal"

dependencies {
    antlr 'org.antlr:antlr4:4.12.0'
}

// Generate the visitor alongside the default listener so consumers (e.g. keka-rust-compiler)
// can build an AST by extending KekaBaseVisitor instead of manually walking listener callbacks.
generateGrammarSource {
    arguments += ['-visitor']
}

// These are to avoid the gradle error in gradle 8.1. Example:
// Task ':keka:spotlessJava' uses this output of task ':keka:generateGrammarSource'
// without declaring an explicit or implicit dependency. This can lead to incorrect results being produced,
// depending on what order the tasks are executed.
tasks.named("sourcesJar").configure { dependsOn("generateGrammarSource") }
